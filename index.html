<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在维护运营</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d12;
            color: #e8ecf3;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 420px; width: 100%; }
        .spinner {
            width: 56px; height: 56px;
            margin: 0 auto 32px;
            border: 4px solid rgba(91, 140, 255, 0.15);
            border-top-color: #5b8cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 14px; letter-spacing: 1px; }
        p { font-size: 15px; color: #8b93a7; line-height: 1.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>正在维护运营</h1>
        <p>服务暂停使用<br>请稍后再来</p>
    </div>
</body>
</html>
