<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican Ride · 鹈鹕骑车</title>
    <!-- ===== 安全防护层 ===== -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=()">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #7ec8e3 0%, #b3e0f2 55%, #8fd98f 55%, #6cbf6c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .scene {
            width: min(96vw, 900px);
            height: min(56vh, 520px);
            position: relative;
        }
        svg { width: 100%; height: 100%; display: block; }

        /* ===== 云 ===== */
        .cloud { animation: drift linear infinite; }
        .cloud-1 { animation-duration: 38s; }
        .cloud-2 { animation-duration: 52s; animation-delay: -20s; }
        .cloud-3 { animation-duration: 44s; animation-delay: -35s; }
        @keyframes drift {
            from { transform: translateX(-120px); }
            to   { transform: translateX(calc(100% + 140px)); }
        }

        /* ===== 自行车轮 ===== */
        .wheel-spokes { animation: spin 0.7s linear infinite; transform-origin: center; }
        .wheel-spokes-f { animation: spin 0.7s linear infinite; transform-origin: center; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 脚蹬 ===== */
        .crank { animation: crank 0.7s linear infinite; transform-origin: center; }
        @keyframes crank { to { transform: rotate(360deg); } }

        /* ===== 骑行起伏 ===== */
        .rider { animation: bounce 0.7s ease-in-out infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }

        /* ===== 鹈鹕头颈摇摆 ===== */
        .pelican-head { animation: bob 0.7s ease-in-out infinite; transform-origin: 330px 240px; }
        @keyframes bob {
            0%, 100% { transform: rotate(-4deg); }
            50%      { transform: rotate(4deg); }
        }

        /* ===== 翅膀扑动 ===== */
        @keyframes wing {
            0%, 100% { transform: rotate(-6deg); }
            50%      { transform: rotate(6deg); }
        }

        /* ===== 喉囊 ===== */
        .pouch { animation: pouch 2.4s ease-in-out infinite; }
        @keyframes pouch {
            0%, 100% { transform: scaleY(1); }
            50%      { transform: scaleY(1.15); }
        }

        /* ===== 背景道路条纹 ===== */
        .roadline { animation: roadmove 0.7s linear infinite; }
        @keyframes roadmove { from { transform: translateX(0); } to { transform: translateX(-60px); } }

        /* ===== 远处山 ===== */
        .hill { animation: hille 25s linear infinite; }
        @keyframes hille { from { transform: translateX(-100px); } to { transform: translateX(100%); } }

        /* ===== 阳光 ===== */
        .sun { animation: pulse 4s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.9; }
            50%      { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="scene">
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">

    <!-- 天空太阳 -->
    <circle class="sun" cx="760" cy="70" r="42" fill="#ffd93d" opacity="0.9"/>
    <circle cx="760" cy="70" r="56" fill="none" stroke="#ffd93d" stroke-opacity="0.3" stroke-width="10"/>

    <!-- 云层 -->
    <g class="cloud cloud-1" opacity="0.85">
        <ellipse cx="0" cy="90" rx="52" ry="20" fill="#fff"/>
        <ellipse cx="-30" cy="80" rx="30" ry="16" fill="#fff"/>
        <ellipse cx="30" cy="82" rx="34" ry="17" fill="#fff"/>
    </g>
    <g class="cloud cloud-2" opacity="0.6">
        <ellipse cx="0" cy="150" rx="42" ry="16" fill="#fff"/>
        <ellipse cx="-24" cy="142" rx="26" ry="13" fill="#fff"/>
        <ellipse cx="24" cy="144" rx="28" ry="14" fill="#fff"/>
    </g>
    <g class="cloud cloud-3" opacity="0.7">
        <ellipse cx="0" cy="50" rx="36" ry="13" fill="#fff"/>
        <ellipse cx="-20" cy="44" rx="22" ry="11" fill="#fff"/>
        <ellipse cx="20" cy="46" rx="24" ry="12" fill="#fff"/>
    </g>

    <!-- 远山 -->
    <g class="hill" opacity="0.35">
        <path d="M-100 320 Q -50 240 0 320 Q 60 230 130 320 Q 190 250 250 320 Q 320 235 390 320" fill="#7faf7f"/>
    </g>
    <g class="hill" opacity="0.28" style="animation-delay:-12s">
        <path d="M-100 320 Q -40 260 20 320 Q 90 240 160 320 Q 230 265 300 320" fill="#6f9f6f"/>
    </g>

    <!-- 地面 -->
    <rect x="0" y="320" width="900" height="200" fill="#6cbf6c"/>
    <rect x="0" y="318" width="900" height="5" fill="#5aab5a"/>

    <!-- 道路 -->
    <rect x="0" y="380" width="900" height="90" fill="#8a8f98"/>
    <!-- 道路中虚线（动画） -->
    <g class="roadline">
        <rect x="20" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="110" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="200" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="290" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="380" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="470" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="560" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="650" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="740" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
        <rect x="830" y="424" width="50" height="6" rx="3" fill="#fff" opacity="0.75"/>
    </g>

    <!-- ================= 鹈鹕骑自行车 ================= -->
    <g class="rider">

        <!-- 自行车 -->
        <g stroke="#e74c3c" stroke-width="6" stroke-linecap="round" fill="none">
            <!-- 后轮 -->
            <circle cx="300" cy="430" r="58" stroke-width="7"/>
            <!-- 前轮 -->
            <circle cx="500" cy="430" r="58" stroke-width="7"/>
            <!-- 车架 -->
            <path d="M300 430 L350 380 L400 430 L350 380 L410 340 L500 430"/>
            <path d="M350 380 L300 340 L410 340"/>
            <!-- 座管 -->
            <path d="M330 385 L330 345"/>
            <!-- 车把 -->
            <path d="M410 340 L430 330 L450 330 L445 315"/>
            <path d="M445 315 L455 322" stroke-width="4"/>
        </g>

        <!-- 后轮辐条（旋转） -->
        <g class="wheel-spokes" style="transform-origin:300px 430px">
            <g stroke="#c0392b" stroke-width="2.5">
                <line x1="300" y1="375" x2="300" y2="485"/>
                <line x1="245" y1="430" x2="355" y2="430"/>
                <line x1="261" y1="391" x2="339" y2="469"/>
                <line x1="339" y1="391" x2="261" y2="469"/>
            </g>
        </g>
        <!-- 前轮辐条（旋转） -->
        <g class="wheel-spokes-f" style="transform-origin:500px 430px">
            <g stroke="#c0392b" stroke-width="2.5">
                <line x1="500" y1="375" x2="500" y2="485"/>
                <line x1="445" y1="430" x2="555" y2="430"/>
                <line x1="461" y1="391" x2="539" y2="469"/>
                <line x1="539" y1="391" x2="461" y2="469"/>
            </g>
        </g>

        <!-- 链条盘 + 脚蹬（旋转） -->
        <g class="crank" style="transform-origin:350px 380px">
            <circle cx="350" cy="380" r="16" fill="#d35400" stroke="#a04000" stroke-width="3"/>
            <line x1="350" y1="380" x2="350" y2="396" stroke="#555" stroke-width="5" stroke-linecap="round"/>
            <rect x="342" y="392" width="16" height="8" rx="3" fill="#444"/>
            <line x1="350" y1="380" x2="350" y2="364" stroke="#777" stroke-width="4" stroke-linecap="round"/>
            <rect x="342" y="356" width="16" height="8" rx="3" fill="#666"/>
        </g>
        <!-- 链条 -->
        <path d="M334 380 Q 300 405 300 430" stroke="#555" stroke-width="3" fill="none" stroke-dasharray="4 3"/>

        <!-- ===== 鹈鹕身体 ===== -->
        <g>
            <!-- 尾羽 -->
            <path d="M272 350 L240 332 L268 342 L244 320 L272 338" fill="#f4f0e6" stroke="#d8d2c4" stroke-width="2"/>
            <!-- 身体 -->
            <ellipse cx="310" cy="330" rx="48" ry="38" fill="#fdfbf5" stroke="#d8d2c4" stroke-width="2.5"/>
            <!-- 翅膀 -->
            <path d="M310 305 Q 350 295 372 322 Q 355 345 310 350 Z" fill="#efe9db" stroke="#d8d2c4" stroke-width="2"/>
            <!-- 翅膀扑动 -->
            <g style="animation: wing 0.7s ease-in-out infinite; transform-origin:310px 320px;">
                <path d="M330 315 Q 360 300 384 318 Q 362 330 330 330 Z" fill="#e8e0cf" stroke="#d0c8b6" stroke-width="2"/>
            </g>
            <!-- 腿（踩脚踏） -->
            <path d="M310 362 L310 380" stroke="#e8a33d" stroke-width="6" stroke-linecap="round"/>
            <path d="M320 362 L335 370" stroke="#e8a33d" stroke-width="6" stroke-linecap="round"/>
        </g>

        <!-- ===== 鹈鹕头颈 ===== -->
        <g class="pelican-head">
            <!-- 长颈 -->
            <path d="M345 315 Q 375 290 388 262 Q 396 245 402 230" stroke="#fdfbf5" stroke-width="16" fill="none" stroke-linecap="round"/>
            <path d="M345 315 Q 375 290 388 262 Q 396 245 402 230" stroke="#d8d2c4" stroke-width="1.5" fill="none" opacity="0.5"/>
            <!-- 头 -->
            <ellipse cx="404" cy="222" rx="17" ry="15" fill="#fdfbf5" stroke="#d8d2c4" stroke-width="2"/>
            <!-- 眼睛 -->
            <circle cx="410" cy="218" r="4.5" fill="#222"/>
            <circle cx="411.5" cy="216.5" r="1.5" fill="#fff"/>
            <!-- 上喙 -->
            <path d="M418 220 Q 448 214 468 222 Q 446 232 420 230 Z" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
            <!-- 下喙 + 喉囊（动画） -->
            <g class="pouch" style="transform-origin:422px 232px;">
                <path d="M420 230 Q 448 236 466 224 Q 452 252 438 258 Q 430 262 424 248 Z" fill="#f6a6a0" stroke="#e08380" stroke-width="2"/>
            </g>
        </g>

        <!-- 车把上的小旗 -->
        <g>
            <line x1="455" y1="322" x2="460" y2="290" stroke="#888" stroke-width="3"/>
            <path d="M460 290 L492 298 L460 306 Z" fill="#e74c3c">
                <animate attributeName="points" dur="0.7s" repeatCount="indefinite"
                    values="460 290 492 298 460 306; 460 290 488 298 460 306; 460 290 492 298 460 306"/>
            </path>
        </g>

        <!-- 踏板动画提示文字 -->
        <text x="410" y="500" font-size="20" fill="#3d6b3d" font-family="PingFang SC, Microsoft YaHei" text-anchor="middle" opacity="0.85">🦩 鹈鹕骑车去兜风 🚴</text>
    </g>

</svg>
</div>

<script src="guard.js"></script>
</body>
</html>
