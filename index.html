<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证件通 · 管理录入系统</title>
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), payment=()">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
            --radius: 14px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            min-height: 100vh;
        }
        .hidden { display: none !important; }

        /* ===== 登录页 ===== */
        #login-view {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            padding: 20px;
        }
        .login-card {
            background: var(--card);
            border-radius: 20px;
            padding: 44px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 64px rgba(15, 23, 42, 0.25);
        }
        .login-logo {
            width: 64px; height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 20px;
        }
        .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .login-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .field input {
            width: 100%; padding: 12px 14px;
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 15px; outline: none; transition: border-color 0.2s;
        }
        .field input:focus { border-color: var(--primary); }
        .btn {
            width: 100%; padding: 13px;
            background: var(--primary); color: #fff;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

        /* ===== 主界面 ===== */
        #main-view { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0 20px; flex-wrap: wrap; gap: 10px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .brand h2 { font-size: 19px; font-weight: 700; }
        .brand .tag { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .logout-btn {
            background: none; border: 1px solid var(--border);
            color: var(--muted); padding: 8px 16px; border-radius: 10px;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            padding: 24px; margin-bottom: 20px;
        }
        .card h3 { font-size: 16px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

        /* 照片上传 */
        .photo-upload {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .photo-upload:hover { border-color: var(--primary); background: #f8fafc; }
        .photo-upload.has-image { border-style: solid; border-color: var(--success); }
        .photo-upload img { max-width: 100%; max-height: 200px; border-radius: 8px; display: block; margin: 0 auto; }
        .photo-upload .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
        .photo-upload input[type=file] { display: none; }
        .photo-upload .preview-empty {
            color: var(--muted); font-size: 14px; padding: 20px 0;
        }
        .photo-upload .preview-empty .icon { font-size: 40px; display: block; margin-bottom: 8px; }

        /* 提交反馈 */
        .submit-row { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
        .submit-row .btn { width: auto; min-width: 180px; }
        .submit-row .status { font-size: 13px; }
        .submit-row .status.ok { color: var(--success); }
        .submit-row .status.err { color: var(--danger); }

        /* 人员列表 */
        .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .list-head .count { font-size: 13px; color: var(--muted); }
        .list-head .refresh-btn {
            background: none; border: 1px solid var(--border); color: var(--muted);
            padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer;
        }
        .list-head .refresh-btn:hover { color: var(--primary); border-color: var(--primary); }
        .person-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border: 1px solid var(--border);
            border-radius: 10px; margin-bottom: 10px;
            transition: background 0.2s;
        }
        .person-item:hover { background: #f8fafc; }
        .person-info { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .person-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #93c5fd, #c4b5fd);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: 700; color: #1e3a8a; flex-shrink: 0;
        }
        .person-name { font-weight: 600; font-size: 15px; }
        .person-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .person-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .delete-btn {
            background: none; border: 1px solid #fecaca; color: var(--danger);
            padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .delete-btn:hover { background: #fef2f2; }
        .empty-list { text-align: center; color: var(--muted); padding: 32px 0; font-size: 14px; }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(37, 99, 235, 0.2); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- ========== 登录界面 ========== -->
<div id="login-view">
    <div class="login-card">
        <div class="login-logo">🪪</div>
        <h1>证件通 · 管理后台</h1>
        <div class="sub">人脸通行证 · 人员录入系统</div>
        <div class="field">
            <label>管理员凭证</label>
            <input type="password" id="login-token" placeholder="请输入管理 Token" autocomplete="off">
        </div>
        <button class="btn" id="login-btn" onclick="doLogin()">登 录</button>
        <div class="error-msg" id="login-error"></div>
    </div>
</div>

<!-- ========== 主界面 ========== -->
<div id="main-view" class="hidden">
    <header>
        <div class="brand">
            <div class="brand-logo">🪪</div>
            <div>
                <h2>证件通 · 管理录入系统</h2>
                <div class="tag">人脸特征库 · 录入端（识别端为通行版 App）</div>
            </div>
        </div>
        <button class="logout-btn" onclick="doLogout()">退出登录</button>
    </header>

    <!-- 录入表单 -->
    <div class="card">
        <h3>📝 录入新人员</h3>
        <form id="enroll-form" onsubmit="submitEnroll(event)">
            <div class="form-grid">
                <div class="field">
                    <label>姓名 <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="f-name" placeholder="必填" required>
                </div>
                <div class="field">
                    <label>性别</label>
                    <input type="text" id="f-gender" placeholder="男 / 女">
                </div>
                <div class="field">
                    <label>民族</label>
                    <input type="text" id="f-ethnicity" placeholder="如：汉族">
                </div>
                <div class="field">
                    <label>出生日期</label>
                    <input type="text" id="f-birth" placeholder="如：1990-01-01">
                </div>
                <div class="field">
                    <label>证件号码</label>
                    <input type="text" id="f-idnum" placeholder="身份证号 / 工号">
                </div>
                <div class="field">
                    <label>部门</label>
                    <input type="text" id="f-department" placeholder="所属部门">
                </div>
                <div class="field">
                    <label>单位 / 组织</label>
                    <input type="text" id="f-org" placeholder="单位名称">
                </div>
                <div class="field">
                    <label>联系电话</label>
                    <input type="text" id="f-phone" placeholder="手机号">
                </div>
                <div class="field" style="grid-column: 1 / -1;">
                    <label>住址</label>
                    <input type="text" id="f-address" placeholder="通讯地址（选填）">
                </div>
            </div>

            <div style="margin-top: 14px;">
                <label>人脸照片 <span style="color:var(--danger)">*</span></label>
                <div class="photo-upload" id="photo-box" onclick="document.getElementById('f-photo').click()">
                    <input type="file" id="f-photo" accept="image/*" capture="user" onchange="previewPhoto(this)">
                    <div class="preview-empty" id="photo-preview">
                        <span class="icon">📷</span>
                        点击拍照 / 选择清晰正面照片
                    </div>
                </div>
            </div>

            <div class="submit-row">
                <button class="btn" type="submit" id="submit-btn">⬆ 提交录入</button>
                <span class="status" id="submit-status"></span>
            </div>
        </form>
    </div>

    <!-- 人员列表 -->
    <div class="card">
        <div class="list-head">
            <h3 style="margin-bottom:0">👥 已录入人员</h3>
            <div style="display:flex;align-items:center;gap:10px">
                <span class="count" id="person-count"></span>
                <button class="refresh-btn" onclick="loadPersons()">🔄 刷新</button>
            </div>
        </div>
        <div id="person-list"></div>
    </div>
</div>

<!-- ===== 防护引擎 ===== -->
<script src="config.js"></script>
<script src="guard.js"></script>
<script>
(function () {
    'use strict';

    var API = window.ZJT_CONFIG.API_BASE;
    var TOKEN_KEY = 'zjt_admin_token';

    // ===== 登录 =====
    window.doLogin = function () {
        var token = document.getElementById('login-token').value.trim();
        var errEl = document.getElementById('login-error');
        if (!token) { errEl.textContent = '请输入管理凭证'; return; }
        // 用 health 验证 + 保存 token
        sessionStorage.setItem(TOKEN_KEY, token);
        showMain();
        errEl.textContent = '';
    };

    window.doLogout = function () {
        sessionStorage.removeItem(TOKEN_KEY);
        location.reload();
    };

    // ===== 视图切换 =====
    function showMain() {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('main-view').classList.remove('hidden');
        loadPersons();
    }

    // ===== 照片预览 =====
    window.previewPhoto = function (input) {
        var box = document.getElementById('photo-box');
        var preview = document.getElementById('photo-preview');
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                preview.innerHTML = '<img src="' + e.target.result + '" alt="预览">';
                box.classList.add('has-image');
            };
            reader.readAsDataURL(input.files[0]);
        }
    };

    // ===== 提交录入 =====
    window.submitEnroll = function (ev) {
        ev.preventDefault();
        var fileInput = document.getElementById('f-photo');
        var status = document.getElementById('submit-status');
        var btn = document.getElementById('submit-btn');

        if (!fileInput.files || !fileInput.files[0]) {
            status.className = 'status err';
            status.textContent = '⚠ 请先选择人脸照片';
            return;
        }
        var file = fileInput.files[0];
        if (file.size > (window.ZJT_CONFIG.MAX_PHOTO_MB || 10) * 1024 * 1024) {
            status.className = 'status err';
            status.textContent = '⚠ 照片超过 ' + (window.ZJT_CONFIG.MAX_PHOTO_MB || 10) + 'MB 上限';
            return;
        }

        var fd = new FormData();
        fd.append('photo', file);
        fd.append('name', document.getElementById('f-name').value.trim());
        fd.append('gender', document.getElementById('f-gender').value.trim());
        fd.append('ethnicity', document.getElementById('f-ethnicity').value.trim());
        fd.append('birth', document.getElementById('f-birth').value.trim());
        fd.append('address', document.getElementById('f-address').value.trim());
        fd.append('id_number', document.getElementById('f-idnum').value.trim());
        fd.append('department', document.getElementById('f-department').value.trim());
        fd.append('organization', document.getElementById('f-org').value.trim());
        fd.append('phone', document.getElementById('f-phone').value.trim());

        btn.disabled = true;
        status.className = 'status';
        status.innerHTML = '<span class="spinner"></span> 正在提取人脸特征并入库…（首次约 10 秒）';

        fetch(API + '/api/enroll', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem(TOKEN_KEY) },
            body: fd
        })
        .then(function (resp) {
            if (resp.status === 401) throw new Error('凭证无效，请重新登录');
            return resp.json().then(function (data) {
                if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
                return data;
            });
        })
        .then(function (person) {
            status.className = 'status ok';
            status.textContent = '✅ 录入成功：' + person.name + '（人脸特征已入库）';
            ev.target.reset();
            document.getElementById('photo-preview').innerHTML = '<span class="icon">📷</span>点击拍照 / 选择清晰正面照片';
            document.getElementById('photo-box').classList.remove('has-image');
            loadPersons();
        })
        .catch(function (err) {
            status.className = 'status err';
            status.textContent = '❌ ' + err.message;
        })
        .finally(function () { btn.disabled = false; });
    };

    // ===== 人员列表 =====
    window.loadPersons = function () {
        var listEl = document.getElementById('person-list');
        var countEl = document.getElementById('person-count');
        listEl.innerHTML = '<div class="empty-list"><span class="spinner"></span> 加载中…</div>';

        fetch(API + '/api/persons')
        .then(function (resp) { return resp.json(); })
        .then(function (persons) {
            countEl.textContent = persons.length + ' 人';
            if (!persons.length) {
                listEl.innerHTML = '<div class="empty-list">暂无录入人员</div>';
                return;
            }
            var html = persons.map(function (p) {
                var avatar = (p.name || '?').charAt(0);
                var meta = [p.department, p.organization, p.phone].filter(Boolean).join(' · ') || '无更多信息';
                var ts = p.created_at ? new Date(p.created_at * 1000).toLocaleString() : '';
                return '' +
                    '<div class="person-item">' +
                    '  <div class="person-info">' +
                    '    <div class="person-avatar">' + avatar + '</div>' +
                    '    <div>' +
                    '      <div class="person-name">' + esc(p.name) + '</div>' +
                    '      <div class="person-meta">' + esc(meta) + ' · ' + ts + '</div>' +
                    '    </div>' +
                    '  </div>' +
                    '  <div class="person-actions">' +
                    '    <button class="delete-btn" onclick="deletePerson(\'' + p.id + '\', \'' + escJS(p.name) + '\')">删除</button>' +
                    '  </div>' +
                    '</div>';
            }).join('');
            listEl.innerHTML = html;
        })
        .catch(function (err) {
            listEl.innerHTML = '<div class="empty-list" style="color:var(--danger)">加载失败：' + esc(err.message) + '</div>';
        });
    };

    window.deletePerson = function (id, name) {
        if (!confirm('确定删除人员「' + name + '」？识别端将无法再识别此人。')) return;
        fetch(API + '/api/persons/' + encodeURIComponent(id), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem(TOKEN_KEY) }
        })
        .then(function (resp) {
            if (resp.status === 401) throw new Error('凭证无效');
            if (!resp.ok && resp.status !== 204) throw new Error('HTTP ' + resp.status);
            loadPersons();
        })
        .catch(function (err) { alert('删除失败：' + err.message); });
    };

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '"', "'": '&#39;' }[c];
        });
    }
    function escJS(s) {
        return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '');
    }

    // ===== 初始化 =====
    if (sessionStorage.getItem(TOKEN_KEY)) {
        showMain();
    }
})();
</script>
</body>
</html>
