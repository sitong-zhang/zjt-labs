    <meta charset="UTF-8">

    <style>
        :root {
            --bg: #0b0d12;
            --card: #151922;
            --card-hover: #1c2230;
            --text: #e8ecf3;
            --text-dim: #8b93a7;
            --border: #232a38;
            --accent: #5b8cff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }
        /* 头部 */
        header {
            text-align: center;
            padding: 60px 24px 20px;
            background: radial-gradient(ellipse 50% 50% at 50% -10%, rgba(91, 140, 255, 0.08), transparent);
        }
        header h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: var(--text-dim);
            margin-top: 10px;
            font-size: 15px;
        }
        .count-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(91, 140, 255, 0.1);
            border: 1px solid rgba(91, 140, 255, 0.25);
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
        }
        /* 筛选 */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 24px 20px;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover { color: var(--text); border-color: var(--accent); }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        /* 图标网格 */
        .wall {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px 24px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }
        .tile {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            cursor: default;
        }
        .tile:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .tile img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }
        .tile .name {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.3;
            word-break: break-all;
            max-width: 100%;
        }
        .tile:hover .name { color: var(--text); }
        /* 脚注 */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 13px;
        }
        @media (max-width: 500px) {
            header h1 { font-size: 26px; }
            .wall { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); padding: 12px 14px 40px; }
            .tile img { width: 32px; height: 32px; }
        }
    </style>
</head>

let currentFilter = "全部";

// 渲染分类按钮
const filterBox = document.getElementById('filters');
categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === '全部' ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    };
    filterBox.appendChild(btn);
});

// 渲染
function render() {
    const wall = document.getElementById('wall');
    wall.innerHTML = '';
    const list = currentFilter === '全部'
        ? allIcons
        : allIcons.filter(i => i.cat === currentFilter);

    list.forEach(icon => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = icon.name;
        if (icon.file) {
            img.src = icon.file;
            img.onerror = () => tile.style.display = 'none';
        } else {
            img.src = `https://cdn.simpleicons.org/${icon.slug}`;
            img.onerror = () => tile.style.display = 'none';
        }
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = icon.name;
        tile.appendChild(img);
        tile.appendChild(name);
        wall.appendChild(tile);
    });
    document.getElementById('countBadge').textContent = `${allIcons.length} 个品牌 / 机构`;
}
