<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在维护</title>
    <!-- ===== 安全防护层 ===== -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=()">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0d12;
            color: #e8ecf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
            padding: 40px 24px;
        }
        .dot {
            width: 52px;
            height: 52px;
            margin: 0 auto 28px;
            border-radius: 50%;
            border: 3px solid #2a3344;
            border-top-color: #5b8cff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        p {
            font-size: 15px;
            color: #8b93a7;
            line-height: 1.7;
        }
        .tag {
            display: inline-block;
            margin-top: 24px;
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(91, 140, 255, 0.08);
            border: 1px solid rgba(91, 140, 255, 0.2);
            color: #5b8cff;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="dot"></div>
        <h1>正在维护运营</h1>
        <p>服务暂停使用</p>
        <div class="tag">请稍后再来</div>
    </div>
    <!-- 前端防护引擎（频率检测 / 行为挑战 / 黑名单） -->
    <script src="guard.js"></script>
</body>
</html>
